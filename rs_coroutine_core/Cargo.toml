[package]
name = "rs_coroutine_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme = "README.md"

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
pin-project = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
# Test utilities for writing coroutine tests with virtual time control
# Similar to Kotlin's TestScope
# Enables tokio's test-util feature for pause()/advance() functionality
test-utils = ["tokio/test-util"]

[lib]
proc-macro = false
